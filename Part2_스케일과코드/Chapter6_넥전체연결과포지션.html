const THEORY={
n1:`<p>12프렛은 개방현의 <b>옥타브</b>예요(진동수 2배). 그래서 지판은 12프렛마다 같은 모양이 반복돼요. 0~12프렛만 외우면 13프렛부터는 -12를 해서 똑같이 읽으면 돼요(13프렛 = 1프렛).</p>
<p>이 반복 덕분에 스케일 모양이 <b>같은 줄의 낮은 자리와 높은 자리</b>에 두 번 나타나요. 높은 쪽은 프렛 간격이 좁아서 손가락이 더 모여요.</p>`,
n2:`<p>같은 키의 루트는 <b>4번줄과 3번줄</b>(그리고 위 옥타브) 두 곳에서 나와요. 3번줄 루트는 4번줄 루트보다 5프렛 왼쪽(또는 7프렛 오른쪽)에 있어요.</p>
<p>어느 자리를 쓸까? ① 앞뒤 음 위치와 가까운 쪽 ② 낮고 묵직한 소리가 필요하면 4번줄 ③ 높은 프렛은 손가락 간격이 좁아 정확도가 떨어질 수 있으니 상황에 맞게. 같은 모양이라 어느 쪽이든 쓸 수 있는 게 베이스의 장점이에요.</p>`,
n3:`<p>넥 전체 지도는 "루트(별)"와 "스케일 음(점)"으로 이뤄져요. 읽는 순서: ① 별을 찾는다 ② 별 기준으로 같은 줄 +2 등 모양을 찾는다 ③ 옆 줄로 5프렛 규칙을 적용한다. 지도 전체를 외우려 하지 말고 <b>별과 모양 두 가지</b>만 찾으면 돼요.</p>`,
n4:`<p>키 찾기 속도를 올리는 요령: <b>"모르는 음 → 4번줄에서 음 이름 찾기 → 필요하면 5프렛 규칙"</b>. 번호 게임은 번호 → 위치 변환(음정 지도), 음 이름 퀴즈는 번호 → 이름 변환(스케일 공식)을 훈련해요.</p>`,
n6:`<p>"C 메이저 잼"의 원리: 반주의 코드(C G Am F)는 모두 C 메이저 스케일의 7음 안에서 만들어졌어요. 그래서 <b>스케일 음만 치면 어떤 마디에서도 코드와 충돌하지 않아요</b>. 다만 어울림의 정도는 코드톤(1·3·5)이 가장 높고, 나머지 스케일 음은 "지나가는 음"으로 쓰는 게 안전해요.</p>
<p>순서: 코드톤으로 뼈대 → 스케일 음으로 걷기 → 접근음으로 연결(Chapter 14).</p>`,
n7:`<p>A 마이너 잼도 같은 원리예요. 다만 곡의 "집"이 A라서 시작과 끝, 그리고 강박에 A를 두면 마이너 색이 살아요. 같은 음을 써도 어디서 쉬느냐(해결음)에 따라 메이저 곡인지 마이너 곡인지가 정해져요.</p>`,
nb1:`<p><b>포지션(position)</b>은 손이 제자리에 있으면서 닿는 4~5프렛 범위예요. 메이저 스케일은 7개 음이라서 7개의 포지션으로 나뉘고, 이웃 포지션은 음 일부를 공유해요.</p>
<ul><li>포지션 안: 손을 안 옮기고 칠 수 있는 구역</li><li>포지션 이동: 겹치는 음에서 손을 옮기면 끊김 없이 이어짐</li></ul>
<p>7개 포지션을 외우는 지름길은 <b>4번줄에서 시작하는 스케일 음 7개</b>를 먼저 아는 것이에요. 블록 이름에 그 음이 적혀 있어요.</p>`,
z6:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};

nb1:[["포지션이 뭐예요?","손이 제자리에 있으면서 닿는 4~5프렛 범위의 음 묶음이에요. 한 포지션 안에서는 손을 안 옮겨요."],["포지션을 옮길 때 소리가 끊겨요.","겹치는 음에서 손을 옮기세요. 그 음이 울리는 동안 다음 포지션으로 이동하면 끊김이 없어요."]],
n6:[["코드마다 음을 다 바꿔야 해요?","코드톤(1·3·5)을 마디 시작에 두고, 사이는 스케일 음으로 채우면 돼요. 코드가 바뀌면 그 코드 루트로 이동해요."]],
n7:[["스케일 음만 쳐도 되나요?","네. 스케일 음 안에서는 틀리지 않아요. 다만 마디 첫 박은 코드 루트를 지키면 더 좋아요."]],
z6:[["단계가 너무 빨리 넘어가요.", "빠르기(BPM) 슬라이더를 먼저 낮추세요. 처음 단계를 더 하고 싶으면 ■ 정지 후 다시 ▶ 를 눌러 처음부터 반복하세요."], ["베이스 소리가 꺼져서 고장 난 줄 알았어요.", "STEP 3·4는 일부러 꺼져요. 내가 칠 차례라는 뜻이에요. 위 '베이스 소리' 체크로 언제든 다시 켤 수 있어요."]]
};
