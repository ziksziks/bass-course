const THEORY={
o1:`<p><b>모드(mode)</b>는 같은 7음을 다른 음에서 시작해 만든 스케일이에요. C 메이저(C D E F G A B)를 D에서 시작하면 도리안, G에서 시작하면 믹솔리디안, A에서 시작하면 마이너(에올리안)가 돼요. 음은 같고 <b>집(루트)만 바뀌니</b> 분위기가 달라져요.</p>
<table><tr><th>시작음(C 메이저 기준)</th><th>모드 이름</th><th>메이저/마이너 계열</th></tr><tr><td>C</td><td>이오니안(메이저)</td><td>메이저</td></tr><tr><td>D</td><td>도리안</td><td>마이너</td></tr><tr><td>G</td><td>믹솔리디안</td><td>메이저(b7)</td></tr><tr><td>A</td><td>에올리안(마이너)</td><td>마이너</td></tr></table>`,
o2:`<p><b>도리안</b> = 마이너에서 <b>6번만 반음 올린</b> 스케일(공식 0 2 3 5 7 9 10). 마이너인데 6번이 밝아서 슬프지만 세련된 느낌이에요. m7 코드(Am7) 위에서 가장 자연스러워요.</p>
<p>사용: 마이너 7 코드가 오래 계속되는 곡(펑크, 소울, 재즈). 6번 음을 강조하면 도리안 색이 드러나요.</p>`,
o3:`<p><b>믹솔리디안</b> = 메이저에서 <b>7번만 반음 내린</b> 스케일(공식 0 2 4 5 7 9 10). 밝지만 "다 끝나지 않은" 열린 느낌이에요. 도미넌트 7 코드(G7)나 I-bVII-IV 진행(G F C G) 위에서 쓰여요.</p>
<p>블루스·록·컨트리에서 자주 쓰이고, b7 음이 강조되면 믹솔리디안 색이 살아요.</p>`,
o4:`<p><b>바이브(vamp)</b>는 한두 개 코드가 계속 반복되는 구간이에요. 코드가 안 바뀌니 화성적 길 찾기가 필요 없고, <b>리듬과 음 선택</b>만으로 곡이 움직여요. 쓰는 음을 4개(1 b3 5 b7)로 제한해도 충분히 음악이 되고, 점점 스케일 음을 늘려 가는 식으로 발전시켜요.</p>`,
o6:`<p>스케일 고르는 기준: ① 코드 이름(성질) 보기 — 메이저 → 메이저/펜타, 마이너 → 마이너/도리안/펜타, 7 → 믹솔리디안/블루스 ② 모르면 펜타토닉(안전). 이름 외우기보다 "코드의 성질 → 스케일 한 줄 요약"을 연결하는 게 중요해요.</p>`,
o7:`<p>즉흥(improvisation)의 구조: ① 코드와 리듬을 귀로 듣는다 ② 마디 1박에 코드 루트를 지킨다 ③ 나머지는 스케일 안에서 모티프를 만든다. "틀릴까 봐 안 치는 것"보다 "틀려도 이어서 치는 것"이 즉흥의 태도예요.</p>`,
z18:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};
