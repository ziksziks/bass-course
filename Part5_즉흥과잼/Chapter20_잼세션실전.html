const THEORY={
j1:`<p><b>잼(jam)</b>은 정해진 악보 없이 코드 진행과 리듬만 공유하고 즉흥적으로 연주하는 모임이에요. 규칙 3가지: <b>듣기</b>(다른 악기를 먼저), <b>맞추기</b>(리듬·세기·키를 같이), <b>양보하기</b>(솔로 순서와 공간). 베이스는 잼의 "바닥"이라서 흔들리지 않는 박과 루트가 가장 큰 기여예요.</p>`,
j2:`<p>귀로 키 찾는 법: ① 곡이 끝났을 때 가장 편안하게 안착하는 음이 <b>1번(집)</b> ② 그 음을 허밍으로 부르고 베이스에서 같은 높이를 찾기 ③ 3번 음이 밝으면 메이저, 어두우면 마이너. 곡의 마지막 코드 루트가 보통 키의 1번이에요.</p>`,
j3:`<p>코드 따라가기: 베이스는 가장 낮은 소리를 쫓으면 돼요. 처음에는 <b>1, 4, 5</b>만 찾아도 대부분의 팝·록·블루스 곡을 따라갈 수 있어요. 틀리면 한 칸 위·아래로 이웃 음을 시도해 보세요. 곡을 먼저 3~4번 듣고 코드가 바뀌는 시점을 잡으세요.</p>`,
j4:`<p>잼 세션에서의 베이스 전략: 시작은 단순(루트·5도) → 분위기가 오르면 옥타브·8분 → 솔로 순서가 오면 공간 확보 → 끝은 루트로 단단하게. <b>한 바퀴마다 조금씩 다르게</b> 해서 음악이 성장하게 만들어요.</p>`,
j5:`<p>밴드 안의 베이스: 드럼과 함께 <b>리듬 섹션</b>을 이루고, 화성적으로는 가장 아래층을 맡아요. 기타·키보드·보컬이 마음껏 움직일 수 있는 이유는 베이스가 기초를 지켜 주기 때문이에요. 좋은 베이시스트는 "눈에 안 띄지만 빠지면 바로 티 나는" 사람이에요.</p>`,
j6:`<p>졸업 실습은 지금까지의 모든 요소를 한 곡으로 통합하는 시험이에요: 키·코드 진행(Ch2~6), 라인(Ch13~15), 주법(Ch8~12), 장르(Ch16), 락인(Ch17), 즉흥(Ch18~19). 한 곡을 끝까지 녹음해서 나중에 다시 들어 보면 성장이 한눈에 보여요.</p>`,
j7:`<p>계속 늘기 위한 루틴: 매일 15분(음 찾기 3분, 스케일 5분, 번호 말하며 치기 2분, 곡 5분) + 주 1회 녹음 점검 + 한 달에 곡 한두 개 카피 + 잼 모임 참여. 습관이 실력을 만들어요.</p>`,
z20:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};

};
