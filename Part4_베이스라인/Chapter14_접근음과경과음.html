const THEORY={
a1:`<p><b>접근음(approach note)</b>은 목표 음(보통 다음 코드 루트)으로 가기 직전에 지나가는 음이에요. 목표보다 <b>반음 아래(또는 위)</b>에서 접근하면 "끌어당기는 힘"이 생겨 연결이 부드러워요. 이 끌림은 7번 음이 8번(옥타브)으로 올라가려는 힘(리딩 톤)과 같은 원리예요.</p>
<p>공식: <b>접근음 = 다음 루트 - 1반음</b> (또는 +1).</p>`,
a2:`<p><b>크로매틱(chromatic)</b>은 반음 간격으로 이어지는 움직임이에요. 12음 모두를 쓰기 때문에 스케일을 벗어나도 반음 이동이면 자연스럽게 들려요. 접근음 한 개(1음 접근), 두 개(반음 두 칸 올라오기), 위아래에서 둘러싸기(엔클로저) 등으로 확장돼요.</p>`,
a3:`<p><b>경과음(passing note)</b>은 코드톤과 코드톤 사이를 이어 주는 음이에요. 예: 루트(1) → 2 → 3도. 스케일 음이라 틀리지 않고, 강박이 아니라 약박(&amp;)에 두면 자연스러워요. 코드톤이 "강한 음", 경과음이 "연결 음"이에요.</p>`,
a4:`<p><b>워킹 베이스</b>는 4분음표로 쉬지 않고 걷듯이 이어지는 라인이에요. 일반 구조: <b>1박 코드톤(보통 루트) - 2박 스케일/경과음 - 3박 코드톤(3도·5도) - 4박 접근음(다음 루트)</b>. 재즈·블루스에서 밴드 전체를 앞으로 끄는 엔진이에요.</p>`,
a6:`<p>라인 업그레이드의 원칙은 "<b>적게 바꾸기</b>". 기존 라인을 유지하고 마지막 박만 접근음으로 바꾸는 것만으로도 연결이 확 좋아져요. 변화는 한 번에 한 곳, 효과가 가장 큰 자리(마디 끝)에.</p>`,
a7:`<p>틀린 음처럼 들리면 한 칸 위·아래로 옮기세요. 반음 이동은 방향이 맞으면 거의 항상 어울려요. 접근음이 어색하게 들리는 원인은 길이가 길거나 강박에 놓았을 때가 많아요. 짧게, 약박에.</p>`,
z14:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};
