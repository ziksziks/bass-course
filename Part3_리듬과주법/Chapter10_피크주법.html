const THEORY={
k1:`<p>피크(플렉트럼)는 엄지와 검지로 집어 줄을 치는 도구예요. 손가락 주법보다 <b>어택(소리 시작)이 선명하고 밝은</b> 소리가 나서 록·펑크록·메탈에 어울려요. 두꺼운(1mm 이상) 피크가 베이스에 좋아요.</p>
<p>잡는 법: 엄지 옆면과 검지 첫 마디 옆면 사이에 피크를 놓고, 끝이 2~3mm만 보이게. 줄에 <b>살짝 비스듬히</b> 닿게 하면 소리가 부드러워요.</p>`,
k2:`<p><b>교대 피킹(alternate picking)</b>은 아래(↓)와 위(↑)로 번갈아 치는 방식이에요. 규칙은 단순해요. <b>박(1 2 3 4)은 ↓, 박 사이(&amp;)는 ↑</b>. 팔이 시계추처럼 멈추지 않고 움직이므로 박자가 일정해지고 빨라져도 흔들리지 않아요.</p>
<p>쉬는 박(쉼표)에서도 <b>팔은 계속 움직이고 줄에 안 닿기만</b> 하면 규칙이 유지돼요. 이걸 "빈 스트로크"라고 해요.</p>`,
k3:`<p>펑크록·팝펑크의 베이스는 <b>일정한 8분음표 루트</b>가 기본이에요. 소리의 일정함(세기·길이·타이밍)이 곧 "기차가 달리는 힘"이에요. 코드가 바뀔 때만 루트가 바뀌고, 그 외엔 같은 음이 계속되니 오른손의 정밀도가 핵심이에요.</p>`,
k4:`<p>줄이 바뀔 때도 ↓↑ 규칙은 그대로예요. 어려운 건 "줄을 건너뛰며 피크가 엉키는 것". 줄을 바꿀 때 <b>오른팔 높이를 미리 바꾸고</b> 팔 전체로 줄을 찾아가면 정확해져요.</p>`,
k6:`<p><b>다이내믹(세기 변화)</b>은 곡의 감정선이에요. 약하게 → 세게 → 약하게의 곡선을 베이스가 보컬·드럼과 함께 그리면 곡이 살아 움직여요. 피크는 같은 속도에서도 <b>줄을 얼마나 깊이 치느냐</b>로 세기를 조절해요(속도가 아니라 깊이!).</p>`,
k7:`<p>피크 vs 핑거는 곡의 요구에 따라 선택해요. 밝고 공격적 → 피크, 둥글고 따뜻 → 핑거. 두 주법의 소리 차이를 귀로 비교하는 연습이 선택의 기준을 만들어요.</p>`,
z10:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};

k4:[["줄을 건너뛸 때 피크가 걸려요.","팔을 줄 높이에 미리 맞추고 손목보다 팔 전체로 이동하세요. 한 줄씩 천천히 연습하세요."]],
k6:[["약하게 치면 소리가 작아져요.","피크가 줄에 닿는 깊이를 줄이면 약해져요. 속도는 그대로, 깊이만 바꾸세요."]],
k7:[["피크와 손가락 중 뭐가 나아요?","정답은 없어요. 곡이 밝고 공격적이면 피크, 따뜻하면 손가락이 어울려요."]],
z10:[["단계가 너무 빨리 넘어가요.", "빠르기(BPM) 슬라이더를 먼저 낮추세요. 처음 단계를 더 하고 싶으면 ■ 정지 후 다시 ▶ 를 눌러 처음부터 반복하세요."], ["베이스 소리가 꺼져서 고장 난 줄 알았어요.", "STEP 3·4는 일부러 꺼져요. 내가 칠 차례라는 뜻이에요. 위 '베이스 소리' 체크로 언제든 다시 켤 수 있어요."]]
};
