const THEORY={
md1:`<p><b>라인 수정의 첫 단계는 "분석"</b>이에요. 원곡 라인을 그대로 따라 친 뒤, 세 가지를 적어 보세요.</p>
<ol><li><b>코드(화성) 층</b>: 마디마다 코드 루트가 무엇인지, 번호로는 몇 번인지.</li><li><b>리듬 층</b>: 한 마디의 음 위치(킥과 같이 치는 칸, 혼자 노는 칸, 쉬는 칸).</li><li><b>음 역할 층</b>: 각 음이 루트·5도·3도·옥타브·접근음·경과음 중 무엇인지.</li></ol>
<p>이 분석표가 있으면 어디를 바꿀 수 있는지가 보여요. 예: "3박이 루트 → 5도로 바꿀 수 있겠다", "4박에 접근음 자리가 있다", "2·10번째 칸은 쉬어도 되겠다".</p>`,
md2:`<p><b>수정 레시피 8가지</b>와 효과를 정리하면 이래요.</p>
<table><tr><th>레시피</th><th>효과</th><th>쓰는 곳</th></tr><tr><td>접근음</td><td>코드 연결이 부드러워짐</td><td>마디 끝</td></tr><tr><td>5도 교체</td><td>힘과 안정감</td><td>3박</td></tr><tr><td>3도 삽입</td><td>코드 색깔이 드러남</td><td>2박</td></tr><tr><td>옥타브 점프</td><td>튀는 에너지</td><td>박 사이</td></tr><tr><td>7도</td><td>다음으로 가려는 긴장</td><td>4박</td></tr><tr><td>고스트노트</td><td>리듬 질감, 펑크</td><td>빈 16분 자리</td></tr><tr><td>쉼표</td><td>숨, 공간</td><td>약박</td></tr><tr><td>당김음</td><td>앞으로 쏠리는 그루브</td><td>3박 등</td></tr></table>
<p>순서: <b>한 번에 하나만 켜서 소리를 듣고, 좋으면 남기고, 아니면 끄기</b>. 최종 라인은 레시피 2~3개의 조합이 가장 좋아요.</p>`,
md3:`<p><b>코드 대체(substitution)</b>는 코드를 같은 가족의 다른 코드로 바꾸는 거예요. 같은 가족은 <b>구성음이 두 개 겹치는 코드</b>예요. 대표 쌍: C↔Am, F↔Dm, G↔Em. 베이스가 루트를 바꾸면 위의 코드 연주자가 그대로여도 곡의 분위기가 바뀌어요. 예: C 마디에서 베이스가 A를 치면 C 코드 위에서 Am7 느낌(C 위 A = 6도)이 돼요.</p>
<p>대체 기본 규칙: ① <b>마디 단위</b>로 ② <b>곡에서 한 번만</b> ③ <b>다른 악기와 사전에 약속</b>. 대체한 코드가 마음에 들면 번호로 적어 두세요(1 → 6).</p>`,
md4:`<p>같은 코드 진행(예: I–V–vi–IV)도 <b>리듬·음 길이·음 높이</b>만 바꾸면 장르가 달라져요.</p>
<table><tr><th>장르</th><th>리듬</th><th>음</th><th>길이</th></tr><tr><td>록</td><td>8분 균등</td><td>루트 중심</td><td>중간</td></tr><tr><td>레게</td><td>1박 쉼, 3박 강조</td><td>루트·5도</td><td>길게</td></tr><tr><td>펑크</td><td>16분+고스트</td><td>루트·옥타브·b7</td><td>짧게</td></tr><tr><td>발라드</td><td>4분 위주</td><td>루트·5도</td><td>길게</td></tr><tr><td>재즈</td><td>4분 워킹</td><td>코드톤+접근음</td><td>레가토</td></tr></table>
<p>장르를 바꾸는 연습은 편곡 실력을 키우는 가장 빠른 방법이에요.</p>`,
md6:`<p><b>인트로·엔딩·필인</b>은 곡의 앞뒤와 연결 부분을 장식해요. 인트로: 베이스 단독 4마디(리프를 먼저 소개) 또는 드럼+베이스. 엔딩: <b>마지막 코드 루트를 길게 + 앞에서 느려지기(리타르단도)</b>. 필인: 구간 끝 마지막 박에 16분음표/접근음.</p>
<p>중요한 것은 <b>시작과 끝의 신호</b>가 밴드 전체에 전달되는 것. 예: 엔딩은 마지막 마디에서 1박·2박·3박에 점점 간격을 두고 쳐서 "끝낼 거예요"를 알려 줘요.</p>`,
md7:`<p>마지막은 <b>내 편곡 만들기</b>예요. 순서: ① 원곡 라인 선택 → ② 분석표 만들기 → ③ 수정 레시피 2~3개 → ④ 인트로·엔딩·필인 설계 → ⑤ 녹음 → ⑥ 원곡과 비교. 이 과정을 곡마다 반복하면 "나만의 베이스 스타일"이 생겨요.</p>`
};
