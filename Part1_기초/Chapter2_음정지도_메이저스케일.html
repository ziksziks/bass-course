<script>
const THEORY={
m1:`<p><b>음정(interval)</b>은 두 음 사이의 거리예요. 거리를 "몇 번째 음인가"로 부르는 게 도수예요: 루트(1도) → 2도 → 3도 → 4도 → 5도 → 6도 → 7도 → 옥타브(8도).</p>
<p>베이스에서 가장 중요한 두 음정은 <b>5도</b>(반음 7칸, 한 줄 위 +2프렛)와 <b>옥타브</b>(반음 12칸, 두 줄 위 +2프렛)예요. 5도는 "루트와 가장 잘 어울리는 짝꿍"이라서 베이스 라인의 단골 재료예요.</p>
<p>핵심: 이제부터는 음 이름(C, D…)이 아니라 <b>"루트에서 몇 칸 떨어졌나"</b>로 지판을 읽어요. 그래야 키가 바뀌어도 같은 방법이 통해요.</p>`,
m2:`<p>루트에서 반음 몇 칸 떨어졌는지에 번호 이름을 붙인 표가 <b>음정 지도</b>예요.</p>
<table><tr><th>반음</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td></tr><tr><th>이름</th><td>R</td><td>b2</td><td>2</td><td>b3</td><td>3</td><td>4</td><td>b5</td><td>5</td><td>b6</td><td>6</td><td>b7</td><td>7</td><td>8</td></tr></table>
<p><b>b(플랫)</b>은 "그 번호 기본 음보다 반음 낮다"는 뜻이에요. 지판에서의 위치는 줄 간격(+5칸)으로 계산돼요: 같은 줄에서는 오른쪽으로 d칸, 한 줄 위로 가면 d-5칸, 두 줄 위로 가면 d-10칸. 그래서 3(4칸)은 한 줄 위 -1칸, 5(7칸)는 한 줄 위 +2칸이 돼요.</p>
<p>이 지도는 <b>루트가 어디든 똑같이</b> 따라와요. 루트를 옮기면 판 전체가 같이 이동하는 거예요.</p>`,
m3:`<p><b>스케일(음계)</b>은 음정 지도에서 일부 번호만 골라 만든 "음 목록"이에요. 메이저 스케일은 <b>R 2 3 4 5 6 7 8</b>을 고른 거예요(b2, b3, b5, b6, b7은 가려짐).</p>
<p>간격(반음 수)으로 보면 <b>2-2-1-2-2-2-1</b>, 즉 <b>온-온-반-온-온-온-반</b>이에요. 반음 구간은 3→4, 7→8 두 군데뿐. 이 공식 하나로 어떤 키의 메이저 스케일이든 만들 수 있어요.</p>
<p>왜 "밝게" 들릴까? 3번 음이 루트보다 장3도(4칸)라서 밝은 느낌을 주고, 7번 음이 8(루트)을 반음 아래에서 강하게 끌어올려요. 이 끌림이 "다 온 것 같은 편안함"을 만들어요.</p>`,
m4:`<p>베이스는 줄 간격이 항상 같아서 메이저 스케일을 <b>하나의 손 모양</b>으로 칠 수 있어요(이동형 모양). 루트에 중지를 올리면 이렇게 돼요.</p>
<table><tr><th>줄</th><th>프렛(루트=0 기준)</th><th>음</th></tr><tr><td>루트 줄</td><td>0, +2</td><td>R, 2</td></tr><tr><td>한 줄 위</td><td>-1, 0, +2</td><td>3, 4, 5</td></tr><tr><td>두 줄 위</td><td>-1, +1, +2</td><td>6, 7, 8</td></tr></table>
<p>손가락: 검지 -1, 중지 0, 약지 +1, 새끼 +2. 손 모양이 고정이라서 <b>루트만 옮기면 12개 키 전부</b>를 칠 수 있어요.</p>`,
m6:`<p><b>키(조)</b>는 "반장(루트)이 누구냐"예요. 같은 모양(메이저 스케일)에 루트만 바꾸면 12개의 키가 돼요. 지판에서는 루트 프렛을 옮기는 일이에요. 키 D = 4번줄 10프렛(또는 3번줄 5프렛)에서 모양 시작.</p>
<p>루트 프렛 찾는 공식: <code>루트 프렛 = (키 음 번호 - 개방현 음 번호) mod 12</code>. 예: 4번줄(E=4)에서 G(7)은 (7-4)=3프렛.</p>
<p>같은 키라도 4번줄 루트와 3번줄 루트 두 자리가 있어요. 손 이동이 적은 쪽을 고르면 돼요.</p>`,
m7:`<p>두 가지 사고 연습을 해요. ① <b>번호 → 위치</b>(음정 지도), ② <b>번호 → 이름</b>(스케일). 예: "G 메이저의 3번 음은?" → 메이저 스케일 공식(0 2 4 5 7 9 11)에서 3번째 값 4를 G(7)에 더하면 11 = B.</p>
<p>번호로 생각하는 습관이 있으면 곡 키가 바뀌어도 라인을 그대로 옮길 수 있어요(이조). 이게 코드표 없이 연주하는 힘의 뿌리예요.</p>`,
m8:`<p>메이저 스케일의 7개 음 위에 각각 코드를 쌓으면 <b>키 안의 7개 코드</b>가 나와요. 성질은 정해져 있어요.</p>
<table><tr><th>번호</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr><tr><th>성질</th><td>메이저</td><td>마이너</td><td>마이너</td><td>메이저</td><td>메이저</td><td>마이너</td><td>감소</td></tr><tr><th>C 키</th><td>C</td><td>Dm</td><td>Em</td><td>F</td><td>G</td><td>Am</td><td>Bdim</td></tr></table>
<p>1(집), 4(이웃집), 5(다음 길)가 곡의 뼈대예요. 베이스는 이 번호들의 루트를 알려 주는 역할이에요.</p>`,
mb1:`<p>번호판의 13칸은 <b>줄 단위 3층</b>으로 나눌 수 있어요. 한 층 안의 칸들은 프렛 번호가 모여 있어서 손이 한 번에 닿는 구역이에요.</p>
<ul><li><b>1층(같은 줄)</b>: R b2 2 b3 → 프렛 +0~+3</li><li><b>2층(한 줄 위)</b>: b3 3 4 b5 5 b6 → -2~+3</li><li><b>3층(두 줄 위)</b>: b6 6 b7 7 8 → -2~+2</li></ul>
<p>"층 이름 + 번호 순서"로 외우면 낱개 13개를 3개 덩어리로 줄일 수 있어요(챙킹).</p>`,
m9:`<p>실습의 핵심은 <b>번호로 생각하며 치기</b>예요. TAB에서 프렛 숫자를 따라 치되, 코드가 바뀔 때마다 "새 루트는 몇 번(1·5·6·4)인가"를 소리 내어 말해 보세요. 눈은 TAB, 귀는 반주, 머리는 번호로 동시에 일하게 하는 훈련이에요.</p>`,
z2:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};

const FAQ={
m1:[["루트와 키가 같은 말인가요?","거의 같아요. <b>루트</b>는 지금 코드(또는 스케일)의 기준 음, <b>키</b>는 곡 전체의 기준 음이에요. 곡의 첫 코드 루트가 보통 키예요."],["5도와 '5번째 음'은 같은 건가요?","스케일에서 5번째 음이 5도예요. 반음으로는 루트에서 7칸 위. 메이저 스케일에서만 같은 의미로 쓰여서, 일단 '5도 = 루트에서 7칸 위, 한 줄 위 +2프렛'으로 기억하세요."]],
m2:[["b3은 반음 낮은 3이라는데 어디가 3이고 어디가 b3이에요?","루트에서 반음 4칸이면 3(밝음), 3칸이면 b3(어두움)이에요. 지판에서는 3이 한 줄 위 한 칸 왼쪽, b3은 같은 줄 3칸 오른쪽이에요."],["같은 번호가 두 군데 있어요. 어느 쪽이에요?","루트 근처 13칸에서 b3과 b6은 두 군데씩 나와요(같은 줄과 한 줄 위). 둘 다 맞아요. 손이 편한 곳을 쓰세요."]],
m3:[["메이저 스케일은 꼭 외워야 하나요?","공식(온온반온온온반) 하나만 외우면 어떤 키든 만들 수 있어요. 지판에서는 손 모양을 외우는 게 더 빨라요."],["반음 구간은 어디예요?","3→4, 7→8 두 군데예요. 이 두 곳에서 손가락이 붙는 느낌이 나요."]],
m4:[["손가락 번호가 헷갈려요.","검지=1, 중지=2, 약지=3, 새끼=4예요. 루트에 중지(2)를 올리고, 검지는 한 칸 왼쪽, 약지·새끼는 오른쪽이에요."],["손 모양이 안 늘어나요.","프렛 간격이 넓은 낮은 프렛에서는 손이 벌려지기 어려워요. 5~8프렛 사이에서 먼저 연습하세요."]],
m6:[["12개 키를 다 외워야 해요?","아니요. 모양 하나만 알고 루트 위치만 찾으면 12개 키를 다 칠 수 있어요. 자주 나오는 키 C G D A E F부터 익히세요."],["루트가 12프렛이면 어떻게 해요?","키가 E일 때처럼 루트가 0프렛이면 12프렛에서 시작해도 같은 소리예요(옥타브). 모양을 위쪽에서 쓰면 돼요."]],
m7:[["번호로 생각하면 뭐가 좋아요?","곡의 키가 바뀌어도 라인을 그대로 옮길 수 있어요(이조). 코드 이름보다 번호가 더 빨라요."]],
m8:[["왜 7번은 감소(dim) 코드예요?","메이저 스케일 7번 음 위에 쌓으면 3도와 5도가 모두 작아져서 '감소' 모양이 돼요. 곡에서는 잘 안 쓰여서 처음엔 신경 쓰지 않아도 돼요."],["1·4·5번이 왜 중요해요?","1은 집, 4는 이웃, 5는 집으로 돌아가고 싶게 만드는 코드예요. 수많은 곡이 이 세 코드로 이뤄져요."]],
mb1:[["층 3개를 한꺼번에 못 외우겠어요.","한 층씩 완벽하게 한 다음 두 층, 마지막에 세 층을 이어요. 가운데 층(한 줄 위)이 가장 많이 쓰여서 이 층부터 시작해도 좋아요."]],
m9:[["연습할 때 TAB과 지판 화면 중 뭘 봐요?","TAB의 프렛 숫자를 읽고, 지판 화면에서 위치를 확인하세요. 익숙해지면 TAB 없이 지판만 보세요."]],
z2:[["단계가 너무 빨리 넘어가요.", "빠르기(BPM) 슬라이더를 먼저 낮추세요. 처음 단계를 더 하고 싶으면 ■ 정지 후 다시 ▶ 를 눌러 처음부터 반복하세요."], ["베이스 소리가 꺼져서 고장 난 줄 알았어요.", "STEP 3·4는 일부러 꺼져요. 내가 칠 차례라는 뜻이에요. 위 '베이스 소리' 체크로 언제든 다시 켤 수 있어요."]]
};

const LESSONS=[
 {id:'m1',min:10,t:'루트에서 5도·옥타브',s:'복습 + 기준점',
  tips:["5도는 \"한 줄 위, 두 칸 오른쪽\", 옥타브는 \"두 줄 위, 두 칸 오른쪽\"이에요.", "루트→5도→옥타브는 밴드 베이스의 기본 무기예요. 거의 모든 곡에서 써요."],
  goal:'루트를 정하면 5도(한 줄 위 +2)와 옥타브(두 줄 위 +2)를 바로 짚기',
  an:'루트는 "반장"이에요. 반장 자리를 정하면 5도는 "한 층 위, 두 칸 오른쪽 짝꿍", 옥타브는 "두 층 위, 두 칸 오른쪽 형"이에요. 앞으로 모든 번호는 반장 자리에서 시작해요.',
  todo:['루트 줄과 프렛을 바꿔 가며 5도·옥타브 위치 보기','실제 베이스로 루트→5도→옥타브를 천천히 치기','퀴즈 맞힘 10개'],
  code:`# 5도 = 루트에서 7칸(반음), 옥타브 = 12칸
NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']
root = NOTES.index('C')
print('5도:', NOTES[(root + 7) % 12])      # G
print('옥타브:', NOTES[(root + 12) % 12])  # C (같은 이름)`,
  build:t=>{const aw=el('div',{class:'boardwrap'});const b=Board(aw,{frets:NF});
    const draw=st=>{drawMap(b,st.rs,st.rf,{pick:p=>[0,7,12].includes(p.d)});b.link([st.rs,st.rf],[st.rs-1,st.rf+2]);b.link([st.rs,st.rf],[st.rs-2,st.rf+2]);};
    const st=rootPicker(t,draw);
    const r=el('div',{class:'row'});r.append(btn('소리 듣기: 루트 → 5도 → 옥타브',()=>{const p=pitch(st.rs,st.rf);[0,7,12].forEach((d,i)=>playPitch(p+d,i*.6));},'primary'));
    t.append(r,aw,el('p',{class:'muted'},'점선이 "5도로 가는 길"과 "옥타브로 가는 길"이에요. 두 길 모두 오른쪽으로 두 칸!'));draw(st);
    const q=el('div',{class:'tool'});t.append(q);mapQuiz(q,{pool:[7,12]});}},
 {id:'m2',min:20,t:'음정 지도 (투명 번호판)',s:'루트 주변 13칸',

  goal:'루트 주변 13칸의 번호(R b2 2 b3 3 4 b5 5 b6 6 b7 7 8) 위치 익히기',

  code:`# 음정 이름표: 루트에서 몇 칸(반음) 떨어졌나
NAMES = {0:'R',1:'b2',2:'2',3:'b3',4:'3',5:'4',6:'b5',
         7:'5',8:'b6',9:'6',10:'b7',11:'7',12:'8'}
# 한 줄 위는 줄이 5칸 높으니까 프렛은 (칸 수 - 5)
def fret(semitones, strings_up):
    return semitones - 5 * strings_up

  tips:["메이저 간격은 \"온온반 온온온반\". 반음은 3→4, 7→8 두 군데뿐이에요.", "도레미파솔라시도로 노래하면서 치면 귀도 같이 훈련돼요."],

  an:'번호판에는 13개 번호가 다 있어요. 구멍 카드는 그중 8개(R 2 3 4 5 6 7 8)만 뚫려 있어요. 스케일은 "구멍으로 보이는 번호들"이고, 간격은 온·온·반·온·온·온·반(반음은 3→4, 7→8 두 군데뿐)이에요.',
  todo:['"구멍 카드 씌우기" 애니메이션 보기','번호를 말하며 한 칸씩 따라 치기 (1 2 3 4 5 6 7 8)','반음 구간(3→4, 7→8)에서 손가락이 붙는 걸 느껴 보기','"번호판 vs 구멍 카드" 차이를 내 말로 설명해 보기'],
  code:`NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']
STEPS = [2, 2, 1, 2, 2, 2, 1]   # 온 온 반 온 온 온 반
def major(root):
    pos, out = NOTES.index(root), [root]
    for s in STEPS:
        pos += s
        out.append(NOTES[pos % 12])
    return out
print(major('C'))  # ['C','D','E','F','G','A','B','C']`,
  build:t=>{const aw=el('div',{class:'boardwrap'});const b=Board(aw,{frets:NF});let ids=[],mode='num';

  code:`# 이동형 모양: (몇 줄 위, 루트 대비 프렛 차이)
