const THEORY={
l1:`<p><b>해머온(hammer-on)</b>은 이미 울리는 줄을 다른 손가락으로 세게 눌러 오른손 없이 다음 음을 내는 기술이에요. TAB에서는 <b>h</b>(또는 ⌒). 왼손 손가락을 "높이 들었다 내려치는" 힘이 소리를 만들어요. 이어서 들리니까 <b>레가토(부드럽게 이어진 소리)</b> 효과가 생겨요.</p>`,
l2:`<p><b>풀오프(pull-off)</b>는 해머온의 반대로, 눌렀던 손가락을 옆으로 살짝 튕기며 떼어서 아래 음을 내는 기술이에요. 이때 <b>아래 음을 누르고 있는 손가락이 미리 줄 위에 있어야</b> 소리가 나요. 해머온+풀오프를 이으면 빠른 트릴(떨림)이나 장식 음을 만들 수 있어요.</p>`,
l3:`<p><b>슬라이드(slide)</b>는 줄을 누른 채 프렛 위를 미끄러져 다른 음으로 이동하는 기술이에요. TAB의 <b>/</b>(위로), <b>\\</b>(아래로). 압력을 유지해야 소리가 끊기지 않고, 목표 프렛에 정확히 도착하는 것이 중요해요. 곡의 마디 끝이나 프레이즈 연결에 자주 써요.</p>`,
l4:`<p><b>비브라토(vibrato)</b>는 음 높이를 미세하게 흔들어 소리에 생명력을 주는 기술이에요. 베이스에서는 손가락을 줄 방향(좌우)으로 살짝 흔들거나, 손목을 앞뒤로 움직여요. 길게 끄는 음(2박 이상)에 쓰면 음이 노래하는 것처럼 들려요. 너무 크면 음정이 불안해지니 폭을 작게 시작하세요.</p>`,
l6:`<p>기교(해머온·슬라이드·뮤트)는 <b>양념</b>이에요. 한 마디에 하나 정도, 리듬을 해치지 않는 선에서 써요. 모든 기교는 박자와 음 길이가 정확해야 아름답게 들려요. 기본(루트·리듬)이 먼저, 기교는 그다음이에요.</p>`,
l7:`<p>레가토 잼의 점검 질문: ① 기교를 넣어도 박자가 일정한가 ② 음이 끊기지 않고 이어지는가 ③ 기교 하나가 곡에 어울리는가. 좋아하는 곡 베이스 라인에서 기교를 찾아 따라 하면 가장 빨리 늘어요.</p>`,
z12:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};
