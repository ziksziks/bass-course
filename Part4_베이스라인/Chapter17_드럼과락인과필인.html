const THEORY={
d1:`<p>드럼 파트는 킥(저음), 스네어(중음), 하이햇(고음)으로 나뉘고, 베이스는 <b>킥과 같은 저음 영역</b>을 나눠 써요. 그래서 둘이 박자를 같이 치면 힘이 커지고, 따로 놀면 저음이 뭉개져요(마스킹). 이것이 락인이 중요한 이유예요.</p>`,
d2:`<p>킥 패턴은 곡마다 달라요. 가장 기본은 1·3박(4 on the floor 는 4박 모두). 싱코페이션 킥은 3&amp; 같은 자리에 와서 흔들림을 만들어요. 베이스는 킥 지도를 귀로 먼저 익히고, <b>킥이 있는 자리 = 진짜 음, 없는 자리 = 고스트나 쉼</b>으로 단순하게 시작해요.</p>`,
d3:`<p><b>스네어 자리(2·4박)</b>는 소리가 넓게 퍼지는 순간이라 베이스가 같이 울면 저음이 흐려질 수 있어요. 스네어 박에는 베이스가 쉬거나 짧게 치면 둘 다 또렷해져요. "서로 피해 주는 배려"가 믹스의 비결이에요.</p>`,
d4:`<p><b>필인(fill-in)</b>은 구간 전환(4·8마디 끝)에서 리듬을 잠깐 변형해 "다음으로 간다"는 신호를 주는 장식이에요. 베이스는 마지막 한 박에 16분음표 두세 개나 접근음을 넣는 정도면 충분해요. 중요한 건 <b>다음 마디 1박에서 루트를 확실히 잡아 주는 것</b>. 필인 뒤 루트가 없으면 곡이 허공에 떠요.</p>`,
d6:`<p>곡의 에너지는 파도 모양이에요. 드럼이 커지면 베이스도 밀도·세기를 키우고, 조용해지면 줄여요. 이걸 다이내믹 매칭이라고 해요. 귀로 드럼의 변화를 따라가는 것이 합주의 기본기예요.</p>`,
d7:`<p>합주 연습 규칙: ① 드럼 소리를 가장 크게 듣기 ② 킥과 락인 ③ 틀려도 멈추지 말기. 합주는 "정확"보다 "함께 가기"가 먼저예요.</p>`,
z17:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};
