const THEORY={
p1:`<p><b>펜타토닉(pentatonic)</b>은 "5음(penta) 음계"예요. 7음 스케일에서 <b>부딪히기 쉬운 두 음</b>을 빼서 만들어요. 반음 간격(예: 3→4, 7→8)이 있으면 코드와 살짝 충돌하는 순간이 생기는데, 반음 구간의 한쪽 음을 빼면 어떻게 쳐도 어울려요.</p>
<table><tr><th>스케일</th><th>7음에서 뺀 음</th><th>공식(반음)</th></tr><tr><td>메이저 펜타</td><td>4, 7</td><td>0 2 4 7 9</td></tr><tr><td>마이너 펜타</td><td>2, b6</td><td>0 3 5 7 10</td></tr></table>
<p>그래서 펜타토닉은 "틀릴 일이 거의 없는" 즉흥의 안전지대예요.</p>`,
p2:`<p>마이너 펜타의 5음은 <b>R, b3, 4, 5, b7</b>이에요. 간격은 <b>3-2-2-3-2</b>(반음 수)로, 한 칸 건너뛰는 큰 걸음(3)이 두 번 있어요.</p>
<p>손 모양(루트 검지): 루트 줄 0·+3, 한 줄 위 0·+2, 두 줄 위 0·+2. 이 6점짜리 상자를 <b>박스 1</b>이라 불러요. 록·블루스 솔로 대부분의 시작점이에요. 루트만 옮기면 12개 키 모두에서 쓸 수 있어요.</p>`,
p3:`<p><b>나란한조 관계가 펜타에도 그대로</b> 적용돼요. C 메이저 펜타(C D E G A)와 A 마이너 펜타(A C D E G)는 같은 5음이에요. 같은 5음에서 <b>어느 음을 집(루트)으로 삼느냐</b>에 따라 밝기가 바뀌어요.</p>
<p>메이저 펜타 모양은 루트 중지(R·2 / 3·5 / 6·8), 마이너 펜타 모양은 루트 검지예요. 모양이 한 칸 차이로 이웃해 있어서 결국 같은 박스를 다른 손가락으로 읽는 셈이에요.</p>`,
p4:`<p><b>블루스 스케일</b> = 마이너 펜타 + <b>b5(블루 노트)</b>. 공식 <code>0 3 5 6 7 10</code>. b5는 4와 5 사이의 반음으로, 일부러 "살짝 어긋난 음"을 지나가면서 쓸쓸하고 끈적한 블루스 맛을 내요.</p>
<p>쓰는 법: 4 → b5 → 5로 반음씩 올라가거나, 5 → b5 → 4로 내려오며 <b>지나가는 음</b>으로 써요. 오래 머물면 코드와 부딪혀 불안해요.</p>`,
p6:`<p>블루스 걸음 <b>1-3-5-6-b7-6-5-3</b>은 도미넌트 7 코드의 구성음(1 3 5 b7)에 경과음 6을 더한 라인이에요. 12마디 블루스에서는 코드가 I7(C7) → IV7(F7) → V7(G7)로 바뀌는데, 각 코드의 루트에서 같은 걸음을 옮겨 치면 돼요.</p>
<p>리듬은 <b>셔플</b>(삼연음 느낌: 한 박을 길-짧 2:1로 나눔)이라 8분음표가 살짝 흔들려요.</p>`,
p7:`<p>잼에서 펜타를 쓰는 규칙은 단순해요. ① 코드가 바뀌면 <b>그 코드 루트</b>를 마디 첫 박에 친다. ② 그 사이는 펜타 음에서 골라 걷는다. ③ 마디 끝은 다음 루트 쪽으로 가까운 음으로 마무리. 이 세 개만 지키면 어떤 진행에서도 어울려요.</p>`,
pb1:`<p>펜타토닉은 지판에서 <b>5개의 박스</b>로 나뉘어요. 한 박스는 4프렛 폭에 줄당 2음. 이웃한 박스는 한 줄 이상의 음을 공유해서 사슬처럼 이어져요. 5개 박스를 낮은 쪽부터 높은 쪽으로 걸으면 넥 한 바퀴예요.</p>
<ul><li>박스 이름은 <b>4번줄 시작 프렛</b>으로 기억해요.</li><li>박스 안 모양은 키가 바뀌어도 같고, 시작 프렛만 이동해요.</li></ul>
<p>"박스 1을 알면 박스 2는 4번줄 음 하나 위"처럼 옆으로 한 칸씩 이동해 외우세요.</p>`,
z4:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};
