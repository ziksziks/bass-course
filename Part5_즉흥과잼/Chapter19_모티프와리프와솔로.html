const THEORY={
i1:`<p><b>모티프(motif)</b>는 곡의 씨앗이 되는 2~5음의 짧은 아이디어예요. 리듬 + 음 높이 모양이 함께 기억돼요. 모티프는 노래로 부를 수 있을 만큼 짧고 분명해야 해요. 한 모티프를 반복·변형해 곡 전체를 만들어요(베토벤 5번 "따따따단"처럼).</p>`,
i2:`<p>발전 기법 3가지: <b>반복</b>(똑같이), <b>변형</b>(일부 음·리듬 바꾸기), <b>대조</b>(전혀 다르게). 가장 쉬운 공식은 <b>A A A' (A에 약간 변화)</b>. 3번 반복 후 끝만 바꿔도 이야기가 돼요.</p>`,
i3:`<p><b>콜 앤 리스폰스(call &amp; response)</b>는 질문 프레이즈(콜)에 대답 프레이즈(리스폰스)를 이어 붙이는 구조예요. 콜은 미완성처럼 끝나(올라가는 음 등), 리스폰스는 마무리처럼 끝나요(루트로 해결). 블루스·재즈·펑크에서 대화하듯 연주하는 기본 형식이에요.</p>`,
i4:`<p><b>리프(riff)</b>는 곡 내내 반복되는 짧은 라인이에요. 반복되므로 <b>단순할수록 강해요</b>. 펜타토닉 3~5음 안에서 리듬을 잘 설계하면 충분해요. 유명 리프 대부분은 리듬이 기억에 남고 음은 적어요.</p>`,
i6:`<p>솔로의 구조: <b>시작(모티프 제시) → 전개(변형·발전) → 클라이맥스 → 마무리(코드톤으로 해결)</b>. 음 수가 많은 것보다 <b>이야기가 있는 것</b>이 좋은 솔로예요. 쉼표도 문장 부호처럼 중요해요.</p>`,
i7:`<p>솔로 연습의 습관: 같은 반주 위에서 매번 다르게 연주해 보고, 녹음해서 마음에 드는 프레이즈를 골라 "내 재료 창고"에 모아 두세요. 그 재료가 다음 즉흥의 씨앗이 돼요.</p>`,
z19:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};
