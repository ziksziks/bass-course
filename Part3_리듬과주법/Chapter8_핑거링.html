const THEORY={
f1:`<p>핑거 주법은 오른손 <b>검지·중지</b> 끝(지문 쪽 살)으로 줄을 <b>당기듯</b> 쳐요. 엄지는 픽업(몸통에 붙은 자석 부분)에 올려 두는 <b>앵커(닻)</b>예요. 엄지가 기준점이 되면 손의 높이와 각도가 일정해서 소리가 고르게 나요.</p>
<ul><li>줄을 때리지 않고 "당겼다 놓기" → 맑은 소리</li><li>손목 일직선 → 부상 예방</li><li>치고 나면 손가락이 다음 줄 위에 걸리도록 → 줄 이동이 빠름(레스트 스트로크)</li></ul>`,
f2:`<p><b>교대 핑거(alternating)</b>는 검(i)-중(m)-검-중을 번갈아 쓰는 방식이에요. 한 손가락만 반복하면 금방 지치고 빨라질 수 없어요. 교대하면 각 손가락이 쉬는 시간이 생겨 두 배 빠르게 칠 수 있어요.</p>
<p>핵심은 두 손가락의 <b>세기와 길이를 같게</b> 만드는 것. 보통 중지가 약해서 일부러 살짝 더 힘을 줘요. 리듬은 항상 박자 위에 맞춰요.</p>`,
f3:`<p>줄이 바뀔 때 손가락 규칙은 "교대는 계속, 줄 위치만 이동"이에요. 높은 줄로 갈 때(낮은 줄→높은 줄)는 손가락이 줄을 건너 내려가고, 낮은 줄로 올 때는 치고 줄에 얹혀요(레이킹).</p>
<p>안 치는 줄이 울리지 않게 <b>오른손은 아래쪽 줄을, 왼손은 위쪽 줄을 막아요</b>. 이게 뮤트의 기본 원리예요.</p>`,
f4:`<p>음의 <b>길이(duration)</b>는 그루브에서 음 높이만큼 중요해요. 같은 리듬이라도 짧게 끊으면(스타카토) 톡톡 튀고, 길게 이으면(레가토) 흘러요. 음의 끝은 왼손이 줄을 놓거나, 오른손이 줄을 막아서 정해요.</p>
<p>밴드에서는 드럼의 킥 소리가 짧으면 베이스도 짧게, 길면 길게 맞춰 주면 한 소리가 돼요.</p>`,
f6:`<p>속도는 <b>이완 + 반복</b>으로 늘어요. 방법: 편한 BPM에서 3번 연속 정확히 → +5 BPM. 한 번에 크게 올리면 근육이 긴장해 실수가 습관이 돼요. 느린 연습으로 몸이 정확한 동작을 기억하고(근기억), 그다음 속도를 입혀요.</p>`,
f7:`<p>실습 점검 3가지: ① <b>박</b>이 일정한가 ② <b>세기</b>가 고른가 ③ <b>끝</b>(음 길이)이 정돈됐는가. 녹음해서 들으면 객관적으로 보여요. 연습이 아니라 연주처럼 "한 곡 끝까지 멈추지 않기"도 훈련이에요.</p>`,
z8:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};

f6:[["메트로놈이 너무 느려요.","느려도 정확한 게 우선이에요. 3번 연속 정확하면 5BPM씩 올리세요."]],
f7:[["연습 방법이 막막해요.","한 곡을 5분만 정해서 박·세기·길이 세 가지를 점검하며 치세요. 녹음하면 더 잘 보여요."]],
z8:[["단계가 너무 빨리 넘어가요.", "빠르기(BPM) 슬라이더를 먼저 낮추세요. 처음 단계를 더 하고 싶으면 ■ 정지 후 다시 ▶ 를 눌러 처음부터 반복하세요."], ["베이스 소리가 꺼져서 고장 난 줄 알았어요.", "STEP 3·4는 일부러 꺼져요. 내가 칠 차례라는 뜻이에요. 위 '베이스 소리' 체크로 언제든 다시 켤 수 있어요."]]
};
