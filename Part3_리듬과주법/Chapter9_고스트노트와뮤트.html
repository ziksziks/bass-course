const THEORY={
g1:`<p><b>고스트노트(ghost note)</b>는 왼손으로 줄을 <b>누르지 않고 살짝 얹어서</b> 오른손으로 치는, 음정 없이 "툭" 소리만 나는 음이에요. TAB에서는 ✕로 써요. 음 높이는 없고 <b>타격감(리듬 질감)</b>만 남아서 드럼의 작은 스네어(고스트 스네어)처럼 작동해요.</p>
<p>역할: 16분음표 사이를 채워 그루브를 만들고, 진짜 음(액센트)을 더 돋보이게 해요. 비유하면 밥(진짜 음) 사이의 반찬이에요.</p>`,
g2:`<p>16비트 펑크 라인의 구조: <b>진짜 음은 적게(1, 3&amp; 등), 고스트는 그 사이를 채움</b>. 오른손은 계속 16분음표로 움직이고, 왼손이 "누를 때(음)/얹을 때(고스트)"만 바꿔요. 그래서 박자가 안 깨지고 몸은 항상 같은 리듬으로 흔들려요.</p>
<p>진짜 음에 <b>액센트(강세)</b>를 주고 고스트는 최대한 약하게 치면 대비가 커져 그루브가 살아요.</p>`,
g3:`<p>라인을 만들 때의 원리: ① 진짜 음 위치를 먼저(킥과 맞추기) ② 고스트는 박과 박 사이(e, a)에 ③ 너무 많으면 진짜 음이 묻히니 "음 1개당 고스트 1~2개" 정도. 같은 음 세트라도 고스트 위치를 옮기면 새로운 그루브가 돼요.</p>`,
g4:`<p>세 가지 "짧은 소리"를 구분해요. <b>스타카토(데드노트)</b>는 음정이 있는 음을 친 뒤 곧바로 끊은 것, <b>고스트노트</b>는 처음부터 음정 없이 누른 것, <b>뮤트</b>는 줄 울림을 막는 동작 전체를 말해요. 셋 모두 "정확한 타이밍으로 소리를 끝내는" 기술이 바탕이에요.</p>`,
g6:`<p>빠른 고스트 라인은 <b>힘 빼기</b>가 전부예요. 오른손 손목이 흔들리듯 움직이고, 왼손은 줄을 얹기만. 손에 힘이 들어가면 고스트가 진짜 음처럼 울려서 지저분해져요. BPM을 5~10씩 올리며 이완을 유지하세요.</p>`,
g7:`<p>펑크 잼의 규칙: 진짜 음은 코드 루트·5도·옥타브 중심으로, 고스트로 리듬을 만들고, 가끔 쉼표로 숨을 줘요. 드럼 킥과 같이 치는 음이 가장 중요한 액센트예요.</p>`,
z9:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};
