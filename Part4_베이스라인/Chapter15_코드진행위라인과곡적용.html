const THEORY={
t1:`<p><b>로마 숫자·번호 표기(디그리 시스템)</b>는 코드를 키 안에서의 번호로 쓰는 방법이에요. C 키에서 1=C, 4=F, 5=G, 6=Am. D 키로 올리면 1=D, 4=G, 5=A, 6=Bm. 번호가 같으면 곡의 구조는 같아요. <b>이조(transpose)</b>, 즉 곡의 키를 바꾸는 일이 번호 덕분에 쉬워져요.</p>
<p>곡 코드를 번호로 바꾸는 순서: ① 곡의 키(1번)를 찾는다(보통 처음·마지막 코드) ② 그 키의 스케일 7음에 번호를 붙인다 ③ 코드 루트를 번호로 변환.</p>`,
t2:`<p><b>대리 코드(substitution)</b>: 두 코드가 구성음 2개를 공유하면 서로 대신 쓸 수 있어요. 메이저 코드의 <b>6번(마이너, 아래로 3반음)</b>이 가장 흔한 짝: C(C E G) ↔ Am(A C E)은 C·E를 공유. 같은 원리로 F↔Dm, G↔Em.</p>
<p>베이스가 루트를 바꾸면 위쪽 코드가 그대로여도 코드 분위기가 달라져요. 이것이 베이시스트가 편곡에 개입하는 가장 쉬운 방법이에요.</p>`,
t3:`<p>장르별 선택 원칙: 느린 곡은 <b>긴 음 + 적은 움직임</b>, 빠른 곡은 <b>일정한 8분음표</b>, 그루브가 강한 곡은 <b>16분 + 고스트</b>. 가장 중요한 기준은 <b>보컬과 멜로디가 들릴 공간</b>을 남기는 거예요.</p>`,
t4:`<p>곡의 구조: 인트로 → 절(Verse) → 후렴(Chorus) → 브릿지 → 후렴 → 아웃트로. 베이스는 구간마다 <b>밀도(음의 개수)</b>를 조절해요. 절: 낮은 밀도(루트 위주), 후렴: 높은 밀도(옥타브·8분), 브릿지: 변화. 구간 연결 부분에 필인을 넣어 이야기가 이어지게 해요.</p>`,
t6:`<p>편곡의 핵심 원칙은 <b>"원곡의 뼈대 유지 + 한 군데 내 색깔"</b>. 코드 루트와 리듬의 큰 틀은 그대로 두고, 마디 끝 접근음·5도 변형 같은 작은 변경으로 개성을 입혀요. 전후를 녹음해 비교하면 효과가 선명해요.</p>`,
t7:`<p>mp3 카피(귀 따기) 순서: ① 속도를 70%로 줄인다 ② 한 번에 4마디씩 구간 반복 ③ 먼저 <b>루트의 위치(어느 음인지)</b>를 찾고 ④ 리듬을 맞추고 ⑤ 마지막에 음 하나하나를 확정. 귀로 찾은 음은 TAB 없이도 외우는 힘을 키워 줘요.</p>`,
z15:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};
