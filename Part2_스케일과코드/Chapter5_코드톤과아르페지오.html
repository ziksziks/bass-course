<script>
const THEORY={
c1:`<p><b>코드(chord)</b>는 3개 이상의 음을 동시에 울린 소리예요. 가장 기본인 <b>삼화음(triad)</b>은 스케일에서 한 칸씩 건너뛰어 3개를 쌓은 것: <b>1도(루트) - 3도 - 5도</b>. C 코드는 C·E·G. 건너뛰며 쌓아서 서로 부딪히지 않고 깨끗하게 울려요.</p>
<p>베이스는 한 번에 한 음이라서 코드의 음을 <b>한 개씩 번갈아</b> 쳐요(= 아르페지오). 그중에서도 맨 아래 음(루트)이 코드의 "이름"이라서 가장 중요해요.</p>`,
c2:`<p>삼화음의 성질은 <b>3도</b>가 결정해요. 루트에서 3도까지가 반음 4칸이면 <b>메이저(밝음)</b>, 3칸이면 <b>마이너(어두움)</b>. 5도는 둘 다 7칸으로 같아요.</p>
<table><tr><th>코드</th><th>구성(반음)</th><th>예 (C)</th></tr><tr><td>메이저</td><td>0 4 7</td><td>C E G</td></tr><tr><td>마이너</td><td>0 3 7</td><td>C Eb G</td></tr><tr><td>감소(dim)</td><td>0 3 6</td><td>C Eb Gb</td></tr></table>
<p>지판에서 3도(메이저)는 "한 줄 위, 1프렛 왼쪽", 마이너 3도는 "같은 줄 3칸 오른쪽(또는 한 줄 위 2칸 왼쪽)"이에요.</p>`,
c3:`<p><b>7th 코드</b>는 삼화음 위에 한 층(7도)을 더 쌓은 4음 코드예요. 어떤 7도를 얹느냐에 따라 이름과 느낌이 달라요.</p>
<table><tr><th>이름</th><th>구성(반음)</th><th>느낌</th></tr><tr><td>도미넌트 7 (C7)</td><td>0 4 7 10</td><td>블루스·록, 다음으로 가고 싶은 긴장</td></tr><tr><td>메이저 7 (Cmaj7)</td><td>0 4 7 11</td><td>부드럽고 몽환적</td></tr><tr><td>마이너 7 (Cm7)</td><td>0 3 7 10</td><td>소울·R&amp;B·재즈</td></tr></table>
<p>b7은 두 줄 위 "루트와 같은 프렛", 7은 거기서 한 프렛 오른쪽이에요.</p>`,
c4:`<p><b>아르페지오(arpeggio)</b>는 코드 음을 한꺼번에가 아니라 차례로 이어 치는 거예요. 1-3-5-3처럼 위로 갔다가 돌아오는 패턴이 가장 흔해요. 리듬을 바꾸면 같은 음으로도 전혀 다른 라인이 돼요(4분 / 8분 / 싱코페이션).</p>
<p>베이스 라인에서 3도는 코드의 색을 알려 주고 5도는 안정감을 줘요. 그래서 1-3-5의 세 음만 알아도 대부분의 곡에 라인을 붙일 수 있어요.</p>`,
c6:`<p>코드가 바뀐다는 건 <b>루트가 이동한다</b>는 뜻이에요. 키 안에서 루트의 이동 거리는 번호로 정해져요. C 키에서 C→G(1→5), G→Am(5→6), Am→F(6→4).</p>
<p>베이스는 이 이동을 가장 먼저 알려 줘서 다른 악기들이 새 코드를 "믿고" 따라오게 해요. 다음 루트를 미리 눈으로 찾아 두는 습관이 필수예요.</p>`,
c7:`<p>코드톤 연주의 원리: <b>마디마다 그 마디 코드의 1·3·5 안에서만 음을 고른다</b>. 이러면 코드와 절대 충돌하지 않아요. TAB의 3도는 코드의 성질에 따라 자동으로 바뀌는 걸 확인해 보세요(메이저 → 4칸, 마이너 → 3칸).</p>`,
cb1:`<p>코드는 <b>도형(블록)</b>으로 기억할 수 있어요. 메이저 도형과 마이너 도형은 3도 자리 하나만 달라요. 7th 도형은 거기에 b7 점 하나가 더 붙어요. 루트 위치만 바꿔서 같은 도형을 "도장처럼" 찍으면 12개 키 모두의 코드가 돼요.</p>
<p>도형 안에서 점들은 모두 손이 한 번에 닿는 범위(3~4프렛)에 있어서 위치 이동 없이 칠 수 있어요.</p>`,
z5:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};

c2:[["메이저 3도와 마이너 3도 차이가 한 칸뿐이라 구분이 안 돼요.","소리로 구분하세요. 3도를 치고 밝으면 메이저, 어두우면 마이너. 같은 루트에서 두 음을 번갈아 들으면 금방 익숙해져요."]],

c6:[["코드가 바뀌는 걸 어떻게 미리 알아요?","곡의 코드표를 보거나, 번호(1·4·5·6)로 읽으면 미리 루트를 눈으로 찾아 둘 수 있어요."]],
cb1:[["코드 도형을 손으로 어떻게 연습해요?","동시에 누르지 않고 하나씩 쳐도 돼요. 도형 안의 3~4점이 손 한 번에 닿는지 확인하세요."]],
c7:[["TAB의 숫자가 코드마다 바뀌는데 왜요?","코드 루트가 바뀌면 같은 라인의 모든 음이 같이 이동해서 그래요. 모양이 같아서 손 모양은 그대로예요."]],
z5:[["단계가 너무 빨리 넘어가요.", "빠르기(BPM) 슬라이더를 먼저 낮추세요. 처음 단계를 더 하고 싶으면 ■ 정지 후 다시 ▶ 를 눌러 처음부터 반복하세요."], ["베이스 소리가 꺼져서 고장 난 줄 알았어요.", "STEP 3·4는 일부러 꺼져요. 내가 칠 차례라는 뜻이에요. 위 '베이스 소리' 체크로 언제든 다시 켤 수 있어요."]]
};
