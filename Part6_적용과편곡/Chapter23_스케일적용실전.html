const SC=[['메이저',MODES.maj],['마이너',MODES.min],['메이저 펜타',MODES.majpent],['마이너 펜타',MODES.minpent],['블루스',MODES.blues],['도리안',MODES.dor],['믹솔리디안',MODES.mix],['로크리안',MODES.loc]];
const THEORY={
sc1:`<p>코드를 보고 "어떤 스케일을 쓸까?"를 정하는 가장 쉬운 방법은 <b>코드 성질 → 스케일 표</b>예요.</p>
<table><tr><th>코드 성질</th><th>쓰기 좋은 스케일</th><th>이유</th></tr><tr><td>메이저(C)</td><td>메이저, 메이저 펜타</td><td>3도가 장3도</td></tr><tr><td>마이너(Am)</td><td>내추럴 마이너, 마이너 펜타</td><td>b3, b7</td></tr><tr><td>마이너7 한 코드 반복</td><td>도리안</td><td>마이너 + 밝은 6</td></tr><tr><td>도미넌트7(G7)</td><td>믹솔리디안, 블루스</td><td>b7</td></tr><tr><td>메이저7(Cmaj7)</td><td>메이저(리디안)</td><td>7이 있음</td></tr><tr><td>m7b5(Bm7b5)</td><td>로크리안</td><td>b5가 있음</td></tr></table>
<p>더 쉬운 방법은 <b>키 하나로 통일</b>하는 거예요. 곡이 C 메이저 키면 C 메이저 스케일 7음을 모든 코드에서 써도 대부분 어울려요(다이어토닉). 그 대신 <b>마디 첫 박은 그 코드의 코드톤</b>을 지켜요.</p>`,
sc2:`<p>스케일 음을 즉흥에 쓰는 가장 중요한 규칙: <b>강박에는 코드톤, 약박에는 스케일 음</b>. 박(1 2 3 4)은 몸이 "여기가 중심"이라고 느끼는 자리라서 코드와 맞는 음(코드톤)이 와야 안정적이고, 박 사이(&)는 지나가는 자리라서 스케일 음(2·4·6)이 와도 어색하지 않아요.</p>
<p>이 규칙 하나로 스케일 음이 "틀린 음"이 될 일이 거의 없어져요. 한 마디를 8분음표 8개로 보면 <b>1(R) 2 3 4 5 6 8 5</b> 처럼 박 위는 코드톤(R, 3, 5, 8), 박 사이는 스케일 음(2, 4, 6)이 돼요.</p>`,
sc3:`<p><b>스케일 런(run)</b>은 스케일 음을 순서대로 올라가거나 내려오는 라인이에요. 쓰는 곳: ① 코드가 오래 유지될 때의 변화, ② 필인(섹션 끝), ③ 솔로의 시작·끝. 규칙: <b>도착 음은 코드톤(보통 루트/옥타브)</b>에 하고, 방향을 한 번 바꾸면(올라갔다 내려오면) 더 음악적이에요.</p>
<p>스케일 런은 한 줄이 아니라 <b>세 줄을 지나가요</b>. 줄을 건널 때 5프렛 규칙으로 이어 가면 끊김이 없어요. 속도는 느리게 시작해서 점점 빠르게. 빠른 런은 "많이 치는 것"이 아니라 "정확히 도착하는 것"이 목적이에요.</p>`,
sc4:`<p><b>펜타토닉과 블루스</b>는 대부분의 코드 위에서 안전해요. 핵심 규칙: <b>마이너 곡엔 마이너 펜타, 메이저 곡엔 메이저 펜타, 7th(블루스) 곡엔 마이너 펜타(+b5) 또는 블루스 스케일</b>. 블루스에서는 I7 위에서 메이저와 마이너 펜타를 섞어 쓰기도 해요.</p>
<p>코드가 바뀔 때는 두 가지 방법이 있어요. ① <b>키 기준</b>: 곡 전체 키의 펜타 하나로 계속. ② <b>코드 기준</b>: 코드마다 그 코드 루트의 펜타로 이동. 처음엔 키 기준이 쉽고, 익숙해지면 코드 기준으로 색을 더해요.</p>`,
sc6:`<p><b>모드 적용</b>은 "한 코드가 오래 지속될 때" 가장 빛나요. <b>도리안</b>(마이너 + 밝은 6): Am7 한 코드나 Am7–D7 바이브. <b>믹솔리디안</b>(메이저 + b7): G7이나 I–bVII–IV. 모드의 색을 내려면 <b>그 모드의 특징 음</b>(도리안의 6, 믹솔리디안의 b7)을 강조하세요.</p>
<table><tr><th>모드</th><th>특징 음</th><th>어울리는 곳</th></tr><tr><td>도리안</td><td>6 (마이너 안의 밝은 6)</td><td>소울·펑크·라틴·재즈 한 코드</td></tr><tr><td>믹솔리디안</td><td>b7 (메이저 안의 어두운 7)</td><td>블루스·록·펑크</td></tr></table>`,
sc7:`<p>스케일 선택의 순서도: <b>① 곡의 키와 모드(메이저/마이너)를 확인 → ② 코드 성질을 확인 → ③ 한 코드가 오래 가면 모드를 쓰고, 빨리 바뀌면 키 하나로 통일 → ④ 모르면 펜타 → ⑤ 마디 첫 박은 항상 코드톤</b>. 이 다섯 단계를 소리 내어 읽으며 곡에 적용하세요.</p>`
};

sc3:[["스케일 런을 빨리 치고 싶어요.","빠른 런은 정확도가 먼저예요. 60BPM에서 5번 연속 맞으면 5씩 올리세요."]],
