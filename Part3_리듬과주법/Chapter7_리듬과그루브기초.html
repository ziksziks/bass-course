const THEORY={
r1:`<p><b>박(beat)</b>은 음악의 일정한 맥박이고, <b>마디(bar)</b>는 박 몇 개를 묶은 단위예요. <b>4/4박자</b>는 한 마디에 4박(위 숫자 4=박 수, 아래 숫자 4=4분음표가 1박). 1박이 가장 세고 3박이 두 번째로 세요.</p>
<p><b>BPM</b>(분당 박 수)이 80이면 한 박은 60÷80 = 0.75초예요. 드럼의 킥은 보통 1·3박, 스네어는 2·4박에 와서 "쿵-짝-쿵-짝"을 만들어요. 베이스는 킥과 짝이라 1·3박에서 단단히 받쳐 줘요.</p>`,
r2:`<p>한 박을 몇 조각으로 나누느냐에 따라 음표가 달라져요.</p>
<table><tr><th>음표</th><th>한 박당 개수</th><th>세는 법</th></tr><tr><td>4분음표</td><td>1</td><td>1 2 3 4</td></tr><tr><td>8분음표</td><td>2</td><td>1 &amp; 2 &amp; 3 &amp; 4 &amp;</td></tr><tr><td>16분음표</td><td>4</td><td>1 e &amp; a 2 e &amp; a ...</td></tr></table>
<p>박 위에 오는 소리를 <b>온비트(down beat)</b>, "&amp;"에 오는 소리를 <b>오프비트(off beat)</b>라고 해요. 오프비트가 많아질수록 몸이 앞으로 쏠리는 에너지가 커져요.</p>`,
r3:`<p><b>쉼표(rest)</b>는 소리를 내지 않는 박이에요. 음악은 소리와 침묵의 비율이 만들어요. 쉼표가 있으면 ① 다른 악기(드럼, 보컬)가 들릴 공간이 생기고 ② 친 음이 더 또렷해지고 ③ 그루브에 "숨"이 생겨요.</p>
<p>중요한 기술: 쉬는 동안에도 <b>손은 줄에 얹어 울림을 막아야</b>(뮤트) 쉼표가 깨끗하게 들려요.</p>`,
r4:`<p><b>싱코페이션(syncopation)</b>은 강박(박 위)을 피하고 약박(&amp;, a)에서 음을 시작해 박의 기대를 살짝 깨는 리듬이에요. 예: "1 &amp; (2) &amp; a"처럼 2박 머리를 비우고 &amp;에서 치기. 우리 몸은 박을 기대하는데 소리가 살짝 앞이나 뒤로 오면 흔들림(그루브)을 느껴요.</p>
<p>중요한 건 박 자체는 일정하게 유지하는 것(발로 박 밟기)이고, 소리의 위치만 박 사이로 옮기는 거예요.</p>`,
r6:`<p><b>락인(lock-in)</b>은 베이스와 킥 드럼이 같은 순간에 소리를 내서 한 덩어리처럼 들리게 하는 거예요. 베이스는 음정이 있는 리듬 악기, 킥은 음정이 없는 리듬 악기. 둘이 맞으면 저음이 두터워지고 곡이 단단해져요.</p>
<p>맞추는 법: 눈으로 TAB을 보기 전에 <b>귀로 킥 위치를 먼저 잡고</b>, 킥이 없는 자리에서는 베이스가 따로 노는 정도를 조절해요.</p>`,
r7:`<p>같은 코드 루트라도 리듬만 바꾸면 곡의 성격이 달라져요. 4분음표(안정) → 8분음표(추진) → 싱코페이션(흔들림) → 레게(공간). 라인을 짤 때 <b>음 높이보다 먼저 리듬을 정하는 것</b>이 베이시스트의 사고 순서예요.</p>`,
z7:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};
