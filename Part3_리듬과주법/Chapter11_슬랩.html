const THEORY={
s1:`<p><b>슬랩(slap &amp; pop)</b>은 두 동작의 합이에요. <b>슬랩(T, 엄지)</b>은 엄지 옆면으로 줄을 때려 프렛에 부딪히게 해서 "탁" 하는 타악기 같은 소리, <b>팝(P)</b>은 검지(또는 중지)로 줄을 위로 당겼다 놓아 줄이 프렛판에 "탁!" 튕기는 날카로운 소리예요.</p>
<p>드럼에 비유하면 엄지=킥, 팝=스네어. 그래서 슬랩 라인은 "베이스로 치는 드럼 비트"로 들려요.</p>`,
s2:`<p>엄지 동작: 손목을 <b>문고리를 돌리듯</b> 회전시켜 엄지 뼈 부분이 줄을 때리고 바로 튕겨 올라와요. 위치는 <b>프렛보드 끝(24프렛 근처)</b>, 낮은 줄(E, A)에 해요. 줄에 오래 머물면 울림이 죽으니 "때리고 바로 나오기"가 포인트예요.</p>`,
s3:`<p>팝은 줄 아래에 손가락 끝을 걸어 <b>수직으로 당겼다 놓는</b> 동작이에요. 주로 높은 줄(D, G)에 해요. 너무 세게 당기면 줄이 상하니 한 번에 90도까지만, 즉 줄 높이의 몇 mm 정도만 당겨도 충분히 소리가 나요.</p>`,
s4:`<p>슬랩 사이에 <b>고스트노트(✕)</b>를 끼우면 리듬이 풍성해져요. 보통 T-(고스트)-P 패턴처럼 규칙적으로 반복되며, 왼손 뮤트가 정확해야 소리가 지저분해지지 않아요. 슬랩에서는 어택이 강하니 <b>왼손으로 안 칠 줄을 막는 습관</b>이 특히 중요해요.</p>`,
s6:`<p>옥타브 슬랩은 <b>T(낮은 음) → P(옥타브 위)</b>를 번갈아 치는 가장 대표적인 리프예요. 두 줄 위 +2프렛이라는 옥타브 모양(Chapter 1)이 그대로 쓰여요. 낮은 음은 엄지로, 높은 음은 팝으로. 이 두 동작의 분업이 슬랩의 기본 문법이에요.</p>`,
s7:`<p>슬랩 연습의 비결은 "짧게 자주"예요. 엄지와 검지의 근육이 쉽게 지쳐서 하루 10분씩 나누는 게 좋아요. 속도보다 <b>소리의 일정함</b>이 먼저예요.</p>`,
z11:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};
