<script>
const THEORY={
tn1:`<p><b>기본 셋업</b>은 소리와 몸의 건강을 좌우해요. 체크 포인트:</p>
<ul><li><b>스트랩 높이</b>: 서서 칠 때와 앉아서 칠 때 오른손·왼손 위치가 같도록. 너무 낮으면 손목이 꺾여요.</li><li><b>줄 높이(액션)</b>: 낮으면 쉽지만 줄이 프렛에 닿아 잡음, 높으면 선명하지만 힘이 들어요.</li><li><b>넥 상태</b>: 계절에 따라 휘어짐이 변하니 이상하면 샵에서 조정.</li><li><b>튜닝</b>: 연습 시작 전 항상 튜너로.</li></ul>
<p>손이 아프거나 소리가 이상하면 연주 습관이 아니라 셋업 문제일 수 있어요. 한 번 전문가에게 점검받는 것이 좋아요.</p>`,
tn2:`<p><b>앰프와 EQ</b> 기본: EQ는 소리를 저음(Low)·중저음·중음·고음(High)으로 나눠 키우거나 줄여요. 베이스는 <b>저음(40~250Hz)</b>이 몸통이고, <b>중음(500Hz~2kHz)</b>이 "소리의 윤곽(어택, 존재감)"이에요. 저음만 키우면 밴드 속에서 뭉개져 안 들리고, 중음이 없으면 소리가 묻혀요.</p>
<p>톤을 만들 때 원칙: <b>① 평평하게 시작 ② 한 번에 하나만 조절 ③ 밴드와 같이 칠 때 최종 조정 ④ 키우기보다 줄이기 먼저</b>. 아래 EQ 랩에서 슬라이더를 움직여 소리 변화를 들어 보세요.</p>`,
tn3:`<p>주법마다 어울리는 톤이 달라요.</p>
<table><tr><th>주법</th><th>EQ 경향</th><th>이유</th></tr><tr><td>핑거(따뜻)</td><td>저음·중저음 ↑, 고음 ↓</td><td>둥글고 굵은 소리</td></tr><tr><td>피크(록)</td><td>중음·고음 ↑</td><td>어택이 또렷</td></tr><tr><td>슬랩</td><td>저음·고음 ↑, 중음 ↓(스쿱)</td><td>탁!과 팝!이 살아남</td></tr><tr><td>레게</td><td>저음 ↑↑, 고음 ↓↓</td><td>묵직하고 둥글게</td></tr></table>
<p>프리셋을 눌러 비교하고, 같은 라인을 쳐 보며 귀로 확인하세요.</p>`,
tn4:`<p><b>밴드 믹스에서 베이스의 자리</b>: 킥 드럼도 저음이라서 베이스와 겹치기 쉬워요. 소리가 안 보이면 <b>저음을 키우기보다 중음(어택)을 살려서</b> 윤곽을 만들어요. 겹침을 피하는 팁: 킥과 베이스의 중심 주파수를 살짝 다르게(킥 60Hz, 베이스 100Hz) 하거나 락인으로 같은 순간에 치기.</p>
<p>악기별 대략의 주파수 대역: 킥 40~100Hz, 베이스 40~250Hz(배음은 800Hz+), 기타 80Hz~5kHz, 보컬 150Hz~4kHz, 하이햇 5kHz 이상. 겹치는 곳에서 서로 양보해요.</p>`,
tn6:`<p><b>줄과 유지관리</b>: 줄은 시간이 지나면 소리가 죽어요(녹, 먼지). 수명은 사용에 따라 몇 달~1년. <b>줄 교체 신호</b>: 튜닝이 안 맞음, 소리가 둔함, 손에 거칠게 느껴짐. 연주 후엔 줄을 마른 천으로 닦으면 오래가요. 튜닝은 <b>매번 연주 전, 합주 중에도 확인</b>. 케이블 접촉 불량은 잡음의 흔한 원인이니 연결 부위를 확인하세요.</p>`,
tn7:`<p><b>몸 관리</b>는 오래 연주하기의 핵심이에요. ① 연습 전 손목·손가락 스트레칭 ② 30분 연주 후 5분 휴식 ③ 어깨·목에 힘 빼기 ④ 아프면 즉시 중단 ⑤ 같은 동작만 길게 하지 않기. <b>하루 15분씩 매일</b>이 한 번에 3시간보다 안전하고 효과적이에요.</p>`
};

tn3:[["프리셋을 그냥 써도 되나요?","시작점으로 좋아요. 내 베이스·앰프·방에 따라 약간 조정하세요."]],
tn4:[["밴드에서 내 소리가 안 들려요.","저음을 키우지 말고 중음(500Hz~1kHz)을 살짝 올려 보세요. 어택이 살아나요."]],
tn6:[["줄은 얼마나 자주 갈아요?","소리가 둔해지고 튜닝이 불안하면 갈 때예요. 보통 몇 달~1년이에요."]],
tn7:[["손목이 아파요.","즉시 쉬고 자세·셋업을 점검하세요. 계속하면 부상이 돼요."]]
