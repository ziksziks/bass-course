const THEORY={
m1:`<p>베이스의 역할은 두 가지예요. <b>화성 기초(어떤 코드인지 루트로 알림)</b>와 <b>리듬 기초(박을 만들기)</b>. 루트만 치면 화성은 알리지만, 음 변화와 리듬 변화가 없어 곡이 단조로워요. 라인을 만든다는 건 이 두 역할을 유지하면서 <b>변화를 더하는 일</b>이에요.</p>
<p>변화의 재료 순서: 루트 → 5도 → 옥타브 → 3도 → 경과음/접근음. 한 번에 하나씩 늘려요.</p>`,
m2:`<p><b>5도</b>는 루트와 가장 잘 어울려요(반음 7칸, 진동수 비 3:2로 단순). 그래서 루트-5도만 번갈아도 안정적이면서 움직임이 생겨요. 지판에서는 한 줄 위 +2프렛이고, 아래로 내려가면 <b>한 줄 아래 -3프렛 (아래 5도)</b>가 있어서 낮은 소리를 원할 때 써요.</p>`,
m3:`<p>옥타브는 같은 음이 높아진 것이라 화성은 그대로, <b>에너지만 커져요</b>. 후렴이나 클라이맥스에서 옥타브를 섞으면 곡이 한 단계 올라간 느낌이 나요. 루트-옥타브를 번갈아 치는 건 디스코·펑크의 대표 패턴이에요.</p>`,
m4:`<p>3도는 코드의 성격(메이저/마이너)을 확정하는 음이에요. 베이스가 3도를 치면 기타·키보드가 없어도 코드 분위기를 알려 줘요. 단, 3도를 <b>강박(1박)에 두면</b> 루트의 안정감이 줄 수 있으니 보통 1박은 루트, 중간 박에 3도를 둬요.</p>`,
m6:`<p>라인을 설계하는 순서: ① 리듬(어느 칸에 칠지) ② 각 칸의 음 역할(루트/5도/옥타브/3도/고스트) ③ 코드 변화 시 규칙 유지. 이 시스템에서는 <b>"음 높이"를 코드 루트 기준 상대값(R, 5, 8…)으로 저장</b>하기 때문에 어떤 코드·키로 바꿔도 라인이 자동으로 따라가요. 이것이 곧 "번호로 생각하기"예요.</p>`,
m7:`<p>좋은 라인의 기준은 "코드가 바뀌어도 규칙이 그대로 통하는가"예요. 이 규칙성 덕분에 곡을 처음 보는 자리에서도 즉석으로 라인을 만들 수 있어요(초견 라인 메이킹).</p>`,
z13:`<p>이 실습은 <b>3단계 학습법</b>이에요. ① 보고 듣기(이해) → ② 같이 치기(모방) → ③ 혼자 치기(독립). 베이스 소리가 꺼지는 STEP 3~4에서 내가 직접 쳐야 진짜 실력이 돼요.</p><p>시작하면 <b>1마디 카운트</b>(딸깍 4번) 뒤에 반주가 나와요. <b>한 바퀴</b>는 코드 진행 한 번(보통 4마디, 블루스는 12마디)이고, 단계마다 정해진 바퀴 수만큼 반복한 뒤 자동으로 다음 단계로 넘어가요. 키·진행·리듬·빠르기는 위 메뉴에서 바꿀 수 있어요.</p>`
};

z13:[["단계가 너무 빨리 넘어가요.", "빠르기(BPM) 슬라이더를 먼저 낮추세요. 처음 단계를 더 하고 싶으면 ■ 정지 후 다시 ▶ 를 눌러 처음부터 반복하세요."], ["베이스 소리가 꺼져서 고장 난 줄 알았어요.", "STEP 3·4는 일부러 꺼져요. 내가 칠 차례라는 뜻이에요. 위 '베이스 소리' 체크로 언제든 다시 켤 수 있어요."]]
};
